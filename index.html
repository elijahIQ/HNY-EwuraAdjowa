<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy New Year 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    background: radial-gradient(circle at bottom, #001f3f, #000);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* ================= BALLOONS ================= */
.balloon-container{
    position:absolute;
    bottom:-250px;
    display:flex;
    gap:30px;
    animation: floatUp 6s ease-in-out forwards;
}

.balloon{
    width:100px;
    height:130px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #fff, crimson);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    box-shadow:0 0 30px rgba(255,0,0,.8);
    position:relative;
}

.balloon::after{
    content:"";
    position:absolute;
    bottom:-45px;
    width:2px;
    height:45px;
    background:white;
}

/* Floating animation */
@keyframes floatUp{
    to{ bottom:60%; }
}

/* ================= FIREWORK EXPLOSION ================= */
.firework{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    animation: spark 1s ease-out forwards;
}

@keyframes spark{
    from{
        transform:translate(0,0) scale(1);
        opacity:1;
    }
    to{
        transform:translate(var(--x), var(--y)) scale(0);
        opacity:0;
    }
}

/* Flash effect */
.flash{
    position:absolute;
    width:200px;
    height:200px;
    background:radial-gradient(circle, rgba(255,255,255,0.9), transparent);
    border-radius:50%;
    animation: flash 0.5s forwards;
}

@keyframes flash{
    from{ transform:scale(0); opacity:1; }
    to{ transform:scale(3); opacity:0; }
}

/* ================= MESSAGE ================= */
.message{
    text-align:center;
    opacity:0;
    transform:scale(0.4);
    transition:1.5s ease;
}

.message.show{
    opacity:1;
    transform:scale(1);
}

.message h1{
    font-size:70px;
    color:gold;
    text-shadow:0 0 20px gold;
}

.message p{
    font-size:30px;
    margin:20px 0;
}

/* ================= BUTTON ================= */
.btn{
    padding:15px 35px;
    background:gold;
    color:black;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    box-shadow:0 0 20px gold;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.15);
    background:white;
}
</style>
</head>

<body>

<!-- BALLOONS -->
<div class="balloon-container" id="balloons">
    <div class="balloon">2</div>
    <div class="balloon">0</div>
    <div class="balloon">2</div>
    <div class="balloon">5</div>
</div>

<!-- MESSAGE -->
<div class="message" id="message">
    <h1>2026 🎆🎉</h1>
    <p>Happy New Year<br><b>EWURA ADJOWA</b></p>
    <a href="/letter.html" class="btn">Click Here</a>
</div>

<script>
const colors = ["#ff004c","#00f7ff","#fff700","#9d00ff","#00ff85"];

function explode(balloon){
    const rect = balloon.getBoundingClientRect();

    // Flash
    const flash = document.createElement("div");
    flash.className = "flash";
    flash.style.left = rect.left + "px";
    flash.style.top = rect.top + "px";
    document.body.appendChild(flash);
    setTimeout(()=>flash.remove(),500);

    // Sparks
    for(let i=0;i<30;i++){
        const spark = document.createElement("div");
        spark.className = "firework";
        spark.style.background = colors[Math.floor(Math.random()*colors.length)];
        spark.style.left = rect.left + 50 + "px";
        spark.style.top = rect.top + 50 + "px";

        spark.style.setProperty("--x", (Math.random()*300-150)+"px");
        spark.style.setProperty("--y", (Math.random()*300-150)+"px");

        document.body.appendChild(spark);
        setTimeout(()=>spark.remove(),1000);
    }

    balloon.style.opacity = 0;
}

// Start explosion after floating
setTimeout(()=>{
    document.querySelectorAll(".balloon").forEach(b=>{
        explode(b);
    });

    setTimeout(()=>{
        document.getElementById("balloons").style.display="none";
        document.getElementById("message").classList.add("show");
    },1200);

},6000);
</script>

</body>
</html>
